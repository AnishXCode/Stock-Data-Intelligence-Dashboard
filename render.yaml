services:
  - type: web
    name: backend-api
    runtime: docker
    rootDir: backend 
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stock-data-dashboard
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11

databases:
  - name: stock-data-dashboard
    plan: free
    postgresMajorVersion: 18